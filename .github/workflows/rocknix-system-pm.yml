name: ROCKNIX RP5 downstream system-PM lifecycle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      ROCKNIX_PROFILE: system-pm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch exact ROCKNIX release recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ROCKNIX/distribution
          ref: 1ebff24f36501fb6493beb2bf83bf2604536d9aa
          path: upstream-rocknix
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /projects/ROCKNIX/packages/linux/
            /projects/ROCKNIX/devices/SM8250/linux/
            /projects/ROCKNIX/devices/SM8250/patches/linux/
            /projects/ROCKNIX/patches/linux/
      - name: Install kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-14 g++-14 bc bison flex libssl-dev libelf-dev dwarves zstd xz-utils cpio kmod rsync squashfs-tools device-tree-compiler
      - name: Prepare system-PM source and Device Tree
        run: |
          set -euo pipefail
          bash rocknix/build.sh prepare 2>&1 | tee rocknix-system-pm-prepare.log
      - name: Build system-PM kernel, modules and Device Tree
        run: |
          set -euo pipefail
          bash rocknix/build.sh compile 2>&1 | tee rocknix-system-pm-compile.log
      - name: Upload build and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rocknix-rp5-system-pm
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            rocknix-out/
            rocknix-system-pm-prepare.log
            rocknix-system-pm-compile.log
