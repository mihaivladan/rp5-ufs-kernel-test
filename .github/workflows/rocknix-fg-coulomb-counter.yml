name: ConsoleOS RP5 paired diagnostic zboot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      ROCKNIX_PROFILE: consoleos-rc1-diagnostic
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 6G
      CCACHE_COMPRESS: 'true'
      CCACHE_COMPRESSLEVEL: '6'
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: 'true'
      CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime
      KERNEL_CC: ccache gcc-14
      HOST_CC: ccache gcc-14
      HOST_CXX: ccache g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch exact ROCKNIX release recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ROCKNIX/distribution
          ref: 1ebff24f36501fb6493beb2bf83bf2604536d9aa
          path: upstream-rocknix
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /projects/ROCKNIX/packages/linux/
            /projects/ROCKNIX/devices/SM8250/linux/
            /projects/ROCKNIX/devices/SM8250/patches/linux/
            /projects/ROCKNIX/patches/linux/
      - name: Install kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-14 g++-14 ccache bc bison flex libssl-dev libelf-dev dwarves zstd xz-utils cpio kmod rsync squashfs-tools device-tree-compiler bsdextrautils file
      - name: Restore kernel compiler cache
        id: kernel-compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ccache
          key: rp5-linux-7.2-gcc14-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            rp5-linux-7.2-gcc14-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure kernel compiler cache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats
          ccache --show-config
          printf 'cache_restore=%s\n' '${{ steps.kernel-compiler-cache.outputs.cache-hit }}'
      - name: Prepare paired diagnostic source
        run: |
          set -euo pipefail
          bash rocknix/build.sh prepare 2>&1 | tee rocknix-consoleos-rc17-productpm5-diagcc1-prepare.log
      - name: Build paired diagnostic kernel and modules
        run: |
          set -euo pipefail
          bash rocknix/build.sh compile 2>&1 | tee rocknix-consoleos-rc17-productpm5-diagcc1-compile.log
      - name: Report kernel compiler cache
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats --verbose | tee rocknix-consoleos-rc17-productpm5-diagcc1-ccache.log
          fi
      - name: Save successful kernel compiler cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ccache
          key: rp5-linux-7.2-gcc14-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
      - name: Upload build and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rocknix-rp5-consoleos-rc17-productpm5-diagcc1-zboot
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            rocknix-out/
            rocknix-consoleos-rc17-productpm5-diagcc1-prepare.log
            rocknix-consoleos-rc17-productpm5-diagcc1-compile.log
            rocknix-consoleos-rc17-productpm5-diagcc1-ccache.log
