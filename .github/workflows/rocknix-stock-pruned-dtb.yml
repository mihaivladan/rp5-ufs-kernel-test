name: ROCKNIX RP5 stock-kernel pruned DTB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rocknix-stock-pruned-dtb.yml'
      - 'rocknix/build.sh'
      - 'rocknix/prepare.py'
      - 'rocknix/cpu-icc-off.config'
      - 'rocknix/sm8250-retroidpocket-rp5-minsleep4.dts'
      - 'rocknix/sm8250-retroidpocket-rp5-stock-pruned.dts'
      - 'rocknix/verify-minimal-dtb.py'
      - 'rocknix/verify-stock-pruned-dtb.py'
      - 'rocknix/dpu-cstate-init.patch'
      - 'ufs-lane-clocks.patch'
permissions:
  contents: read
jobs:
  dtb:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      ROCKNIX_PROFILE: stock-pruned
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch exact ROCKNIX release recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ROCKNIX/distribution
          ref: 1ebff24f36501fb6493beb2bf83bf2604536d9aa
          path: upstream-rocknix
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /projects/ROCKNIX/packages/linux/
            /projects/ROCKNIX/devices/SM8250/linux/
            /projects/ROCKNIX/devices/SM8250/patches/linux/
            /projects/ROCKNIX/patches/linux/
      - name: Install Device Tree build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-14 g++-14 bc bison flex libssl-dev libelf-dev dwarves zstd xz-utils cpio kmod rsync squashfs-tools device-tree-compiler
      - name: Build and verify stock-kernel pruned Device Tree
        run: |
          set -euo pipefail
          bash rocknix/build.sh prepare 2>&1 | tee rocknix-stock-pruned-dtb.log
      - name: Upload verified DTB and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rocknix-rp5-stock-pruned-dtb
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            rocknix-out/
            rocknix-stock-pruned-dtb.log
