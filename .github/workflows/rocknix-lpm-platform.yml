name: ConsoleOS RP5 display ownership
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rocknix-lpm-platform.yml'
      - 'rocknix/build.sh'
      - 'rocknix/prepare.py'
      - 'rocknix/consoleos-early-splash.c'
      - 'rocknix/generate-early-display-profiles.py'
      - 'rocknix/boot-display/profiles/**'
      - 'rocknix/consoleos-rc1.config'
      - 'rocknix/CONSOLEOS-RC1.md'
      - 'rocknix/sm8250-adsp-no-auto-boot.patch'
      - 'rocknix/q6afe-lpass-hw-vote-handle.patch'
      - 'rocknix/lpass-macro-pm-clock-backport.patch'
      - 'rocknix/qcom-pcie-drv-handoff.patch'
      - 'rocknix/qcom-pcie-drv-offline-suspend.patch'
      - 'rocknix/qcom-pcie-offline-pinctrl.patch'
      - 'rocknix/qcom-fg-gen4-coulomb-counter.patch'
      - 'rocknix/retroid-gamepad-remove.patch'
      - 'rocknix/retroid-mcu-rgb-system-pm.patch'
      - 'rocknix/pwm-fan-configurable-startup.patch'
      - 'rocknix/qcom-pmic-typec-pdphy-attach-gating.patch'
      - 'rocknix/qca6390-orderly-poweroff.patch'
      - 'rocknix/qcom-pcie-orderly-icc-release.patch'
      - 'rocknix/rpmh-regulator-suspend-state.patch'
      - 'rocknix/regulator-core-s2idle-state-mem.patch'
      - 'rocknix/rpmh-regulator-suspend-trace.patch'
      - 'rocknix/sm8250-retroidpocket-rp5-phase4a-wireless-adsp-pcie-drv.dts'
      - 'rocknix/sm8250-retroidpocket-rp5-consoleos-rc1.dts'
      - 'rocknix/verify-pcie-drv-dtb.py'
      - 'rocknix/verify-consoleos-rc1-dtb.py'
      - 'rocknix/sm8250-retroidpocket-rp5-minsleep4.dts'
      - 'rocknix/sm8250-retroidpocket-rp5-stock-pruned.dts'
      - 'rocknix/reenable-matrix.json'
      - 'rocknix/generate-reenable-matrix.py'
      - 'rocknix/dpu-cstate-init.patch'
      - 'rocknix/a6xx-stale-rpmh-votes.patch'
      - 'ufs-lane-clocks.patch'
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      ROCKNIX_PROFILE: consoleos-rc1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 6G
      CCACHE_COMPRESS: 'true'
      CCACHE_COMPRESSLEVEL: '6'
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: 'true'
      CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime
      KERNEL_CC: ccache gcc-14
      HOST_CC: ccache gcc-14
      HOST_CXX: ccache g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch exact ROCKNIX release recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ROCKNIX/distribution
          ref: 1ebff24f36501fb6493beb2bf83bf2604536d9aa
          path: upstream-rocknix
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /projects/ROCKNIX/packages/linux/
            /projects/ROCKNIX/devices/SM8250/linux/
            /projects/ROCKNIX/devices/SM8250/patches/linux/
            /projects/ROCKNIX/patches/linux/
      - name: Install kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-14 g++-14 ccache bc bison flex libssl-dev libelf-dev dwarves zstd xz-utils cpio kmod rsync squashfs-tools device-tree-compiler
      - name: Restore kernel compiler cache
        id: kernel-compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ccache
          key: rp5-linux-7.2-gcc14-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            rp5-linux-7.2-gcc14-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure kernel compiler cache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats
          ccache --show-config
          printf 'cache_restore=%s\n' '${{ steps.kernel-compiler-cache.outputs.cache-hit }}'
      - name: Prepare ConsoleOS RP5 display-ownership2 source
        run: |
          set -euo pipefail
          bash rocknix/build.sh prepare 2>&1 | tee rocknix-consoleos-rc17-productpm2-prepare.log
      - name: Build ConsoleOS RP5 display-ownership2 kernel and modules
        run: |
          set -euo pipefail
          bash rocknix/build.sh compile 2>&1 | tee rocknix-consoleos-rc17-productpm2-compile.log
      - name: Report kernel compiler cache
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats --verbose | tee rocknix-consoleos-rc17-productpm2-ccache.log
          fi
      - name: Save successful kernel compiler cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ccache
          key: rp5-linux-7.2-gcc14-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
      - name: Upload build and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rocknix-rp5-consoleos-rc17-display-ownership2
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            rocknix-out/
            rocknix-consoleos-rc17-productpm2-prepare.log
            rocknix-consoleos-rc17-productpm2-compile.log
            rocknix-consoleos-rc17-productpm2-ccache.log
